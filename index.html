<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ændringsønsker til Murphey</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#121417);--ink:light-dark(#16202c,#eef1f4);--muted:light-dark(#5b6573,#a3acb8);--line:light-dark(#e3e6ea,#2b3139);--red:light-dark(#c8102e,#ff5a6e)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Poppins,system-ui,sans-serif;display:grid;place-items:center;padding:16px}
form{width:min(360px,100%);display:grid;gap:12px}
h1{font-size:22px;margin:0 0 4px}
label{font-size:14px;color:var(--muted)}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);min-height:44px}
input:focus-visible,button:focus-visible{outline:2px solid #1a73e8;outline-offset:2px}
button{font:inherit;font-weight:600;min-height:44px;border:0;border-radius:6px;background:var(--red);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--red);font-size:14px;min-height:21px;margin:0}
</style>
</head>
<body>
<form id="f" autocomplete="off">

</form>

  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c)));
  try{sessionStorage.setItem('murphey-pw',pw);}catch(e){}
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const b=document.getElementById('go'),er=document.getElementById('err');
  b.disabled=true;er.textContent='';
  try{await open(document.getElementById('pw').value);}catch(x){er.textContent='Forkert adgangskode / Fel lösenord';b.disabled=false;}
});
try{const p=sessionStorage.getItem('murphey-pw');if(p)open(p).catch(()=>sessionStorage.removeItem('murphey-pw'));}catch(e){}
